server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Hashed asset filenames change whenever their contents do, so they can be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The entry point must never be cached: it is the file that names the current asset hashes, so a
    # stale copy points a returning visitor at bundles that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Client-side routing. A request for /trips is a route in the application, not a file on disk —
    # without this it would be a 404 for anyone who reloads the page or follows a shared link.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
