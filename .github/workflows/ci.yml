name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/no_overlap
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint, typecheck, test
        run: pnpm turbo run lint typecheck test

      # Integration tests spin an ephemeral Postgres via Testcontainers (Docker is available on the
      # runner) and boot the app, so they need the env the schema validates. The RSA keypair is
      # generated fresh per run — throwaway, used only to sign/verify within this job.
      - name: Integration tests (Testcontainers)
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/jwt.key
          openssl rsa -in /tmp/jwt.key -pubout -out /tmp/jwt.key.pub
          export JWT_PRIVATE_KEY_B64=$(base64 -w0 /tmp/jwt.key)
          export JWT_PUBLIC_KEY_B64=$(base64 -w0 /tmp/jwt.key.pub)
          pnpm --filter api test:int

  # Images are built here rather than on the server. The deployment target is a single small
  # instance that also runs the database, the cache and the proxy; asking it to run a full install
  # and compile two applications would take memory from the thing it is meant to be serving, and
  # would do so during a deploy, which is exactly when it is least affordable. The runner has
  # capacity to spare and is already checking this commit.
  publish:
    # Only after the commit is known good. A tag pointing at an image that fails its own test suite
    # is worse than no tag, because something will eventually deploy it.
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [api, worker]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Provided to the workflow automatically; no secret to create or rotate.
          password: ${{ secrets.GITHUB_TOKEN }}

      # Registry paths must be lowercase, and a repository name is free not to be.
      - name: Resolve image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')-${{ matrix.app }}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: APP=${{ matrix.app }}
          push: true
          # Two tags on purpose: `latest` is what the deployment follows, and the commit sha is what
          # makes a rollback possible — `latest` moves, so it cannot name the version to go back to.
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  # The migrator is a separate image because applying a migration needs the Prisma CLI, which the
  # runtime images deliberately do not carry. Built once, not per application.
  publish-migrator:
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')-migrate" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrate
          build-args: APP=api
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,mode=max,scope=migrate

  # The client is built separately because it is not a Node service: it compiles to static files and
  # ships behind nginx, which is why the resulting image is a fraction of the size of the others.
  publish-web:
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')-web" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
